<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feliz Primavera 💛</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="intro" class="screen">
      <button id="start" aria-label="Abrir sorpresa">
        <span class="flower big">
          <span class="petals"></span>
          <span class="center"></span>
        </span>
        <span class="click-text">Click aquí</span>
      </button>
    </section>

    <section id="garden" class="screen hidden" aria-hidden="true">
      <div class="sky"></div>
      <div class="ground"></div>
      <div class="trunk"></div>
      <div id="crown" class="crown"></div>
      <div id="message" class="message">
        <p>Algunos amores son como los girasoles, nunca dejan de buscar su sol y tú eres mi sol.</p>
        <h1>Feliz Primavera Preciosa💛</h1>
        <div class="signature">I.V</div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
